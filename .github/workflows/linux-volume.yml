name: Linux volume

on:
  push:
    branches:
      - linux-volume-check

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio players
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils alsa-utils libasound2-plugins

      - name: Measure alert loudness
        run: python3 .github/linux_volume_play.py
